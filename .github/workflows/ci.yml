name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 数据必须能从 vendor/ + scripts/ 完全重建。
      # 有人手改了 src/data.b64.mjs 却忘了改构建脚本，这里会拦住。
      - name: 验证数据可复现
        run: |
          npm run build
          git diff --exit-code src/data.b64.mjs \
            || (echo "::error::src/data.b64.mjs 与 vendor/ 不一致，请本地跑 npm run build 后提交生成结果" && exit 1)

      - name: 测试三个入口
        run: npm test
