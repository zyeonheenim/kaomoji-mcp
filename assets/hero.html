<!doctype html><html lang="zh"><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{
  font-family:"PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;
  background:#FFF8F1;color:#2B2725;-webkit-font-smoothing:antialiased;
}
.card{position:relative;width:1280px;height:640px;overflow:hidden;
  background:
    radial-gradient(circle at 96% 2%, #FFE1ED 0 200px, transparent 201px),
    radial-gradient(circle at 1% 97%, #DDF6F0 0 230px, transparent 231px),
    #FFF8F1;}
.dots{position:absolute;inset:0;z-index:0;
  background-image:radial-gradient(#EADFD3 2px, transparent 2px);
  background-size:32px 32px;opacity:.55}
.pad{position:absolute;inset:0;z-index:2;padding:64px 72px;
  display:flex;align-items:center;gap:56px}

.left{flex:1;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:11px;font-size:25px;font-weight:800;
  color:#A79A8C;letter-spacing:.5px;margin-bottom:30px}
.brand i{font-style:normal;color:#FF6FA5;font-size:27px}

h1{font-size:82px;font-weight:900;line-height:1.12;letter-spacing:-3px}
.hl{background:linear-gradient(transparent 58%,#FFD466 58%,#FFD466 92%,transparent 92%);
  padding:0 5px;border-radius:5px}

.sub{margin-top:30px;font-size:27px;font-weight:600;color:#7A6E62;line-height:1.55}

.pills{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}
.pill{background:#fff;border:3px solid #2B2725;border-radius:999px;
  padding:8px 20px;font-size:19px;font-weight:800;white-space:nowrap}
.pill.pink{background:#FFE9F1}
.pill.mint{background:#E2F7F1}

.right{width:474px;display:flex;flex-direction:column;gap:22px}

.kao{background:#fff;border:4px solid #2B2725;border-radius:26px;
  padding:20px 26px;display:flex;flex-direction:column;gap:9px;
  box-shadow:9px 9px 0 rgba(43,39,37,.10)}
.kao.pink{box-shadow:9px 9px 0 #FFC7DC}
.kao.mint{box-shadow:9px 9px 0 #B7EBDD}
.kao.yellow{box-shadow:9px 9px 0 #FFE29A}

.kao .tag{font-size:18px;font-weight:800;color:#9C8F80;letter-spacing:.5px}
.kao .k{font-family:-apple-system,"PingFang SC","Hiragino Sans","Apple Color Emoji",sans-serif;
  font-size:31px;font-weight:600;line-height:1.25;white-space:nowrap}
</style>

<div class="card">
  <div class="dots"></div>
  <div class="pad">

    <div class="left">
      <div class="brand"><i>✿</i> kaomoji-picker-mcp</div>
      <h1>按心情<br>挑一条<span class="hl">颜文字</span></h1>
      <div class="sub">22,364 条 · 38 个情绪分类<br>零依赖 · 一条就够，不堆</div>
      <div class="pills">
        <span class="pill pink">MIT</span>
        <span class="pill">本地 stdio</span>
        <span class="pill mint">自托管 HTTP</span>
      </div>
    </div>

    <div class="right">
      <div class="kao pink">
        <span class="tag">下班了超开心</span>
        <span class="k">ε=ε=(ﾉ≧ω≦)ﾉﾜｰ</span>
      </div>
      <div class="kao yellow">
        <span class="tag">被夸了有点不好意思</span>
        <span class="k">テヘ(//ω照♥</span>
      </div>
      <div class="kao mint">
        <span class="tag">困得要死</span>
        <span class="k">Zz(´-ω-`*)</span>
      </div>
    </div>

  </div>
</div>
